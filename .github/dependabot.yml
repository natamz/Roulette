version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nuxt:
        patterns:
          - "nuxt"
          - "nuxi"
          - "@nuxt/*"
          - "@nuxtjs/*"
        exclude-patterns:
          # lint-test グループで更新する
          - "@nuxt/eslint"
      vuetify:
        patterns:
          - "vuetify"
          - "vite-plugin-vuetify"
          - "@mdi/font"
      lint-test:
        patterns:
          - "eslint"
          - "@nuxt/eslint"
          - "typescript"
          - "vue-tsc"
          - "vitest"
          - "fake-indexeddb"
          - "@playwright/test"
          - "serve"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
